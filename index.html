<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Službař</title>
<meta name="theme-color" content="#4b5320">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: polní khaki — olivová hlavička se šablonovým písmem, pod ní karty týdnů jako štítky na bedně */
:root{
  --bg:#d6cdaa; --card:#ebe4ca; --fg:#262a1a; --muted:#5d5c42; --line:#b2a882; --band:#4b5320; --band-fg:#efe8cc;
  --accent:#4b5320; --duty:#8b2e1a; --duty-bg:#ecd2c2; --off:#4b5320; --off-bg:#d5d8b2;
  --hol:#7a1f2b; --hol-bg:#ebcfcf; --short:#8a6512; --short-bg:#ecdcae;
  --font-stencil:"Saira Stencil One","Stencil",Impact,sans-serif;
  --font-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f2317; --card:#2c3121; --fg:#e6dec2; --muted:#a5a184; --line:#454d33; --band:#3b421f; --band-fg:#e6dec2;
  --accent:#a9b26a; --duty:#dd7652; --duty-bg:#45291d; --off:#a9b26a; --off-bg:#363e25;
  --hol:#e3808b; --hol-bg:#47252b; --short:#d8ae55; --short-bg:#40361b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f2317; --card:#2c3121; --fg:#e6dec2; --muted:#a5a184; --line:#454d33; --band:#3b421f; --band-fg:#e6dec2;
  --accent:#a9b26a; --duty:#dd7652; --duty-bg:#45291d; --off:#a9b26a; --off-bg:#363e25;
  --hol:#e3808b; --hol-bg:#47252b; --short:#d8ae55; --short-bg:#40361b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
.band{background:var(--band);color:var(--band-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 16px;
  border-bottom:6px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--band-fg) 0 8px,var(--band) 8px 16px) 6}
.band > div{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:center;text-align:center;gap:12px}
.band .vojak{height:78px;width:auto;flex:none;margin-block:-6px}
.band .znak{height:70px;width:auto;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
h1{font-family:var(--font-stencil);font-weight:400;font-size:30px;letter-spacing:.04em;margin:0;line-height:1.1;text-transform:uppercase;text-wrap:balance}
.sub{font-family:var(--font-cond);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;margin:6px 0 0;opacity:.8}
.wrap{max-width:520px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
.pick{background:var(--card);border:2px solid var(--line);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pick-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pick-head > label{font-family:var(--font-cond);font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:2px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font-family:var(--font-cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--fg);padding:5px 12px;cursor:pointer;background:var(--card)}
.seg label + input + label{border-left:2px solid var(--accent)}
.seg input:checked + label{background:var(--accent);color:var(--card)}
.seg input:focus-visible + label{outline:2px solid var(--duty);outline-offset:-2px}
.datebox{border:2px solid var(--line);border-radius:2px;background:var(--bg);overflow:hidden;width:100%;box-sizing:border-box}
.datebox:focus-within{border-color:var(--accent)}
.pick input[type=date]{display:block;width:100%;max-width:100%;min-width:0;-webkit-min-logical-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;border:0;border-radius:0;background:transparent;margin:0;padding:10px 12px;min-height:46px;font-family:var(--font-mono);font-size:17px;color:var(--fg);text-align:left;outline:none}
.pick input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.info{font-size:14px;color:var(--muted)}
.info b{color:var(--fg)}
#out{display:flex;flex-direction:column;gap:14px}
.note{font-size:13px;color:var(--muted);margin:0}
.week{background:var(--card);border:2px solid var(--line);border-radius:2px;overflow:hidden}
.week h2{margin:0;padding:9px 14px;font-family:var(--font-stencil);font-weight:400;font-size:19px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--card);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.week h2 span{font-family:var(--font-mono);font-size:13px;letter-spacing:0;opacity:.85;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.row:last-of-type{border-bottom:0}
.day{font-family:var(--font-cond);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.day small{display:block;color:var(--muted);font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:0;font-variant-numeric:tabular-nums}
.val{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;min-width:0}
.val em{display:block;font-family:var(--font-body);font-style:normal;font-size:12px;color:var(--muted)}
.h{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--font-cond);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:1px;margin-right:7px;vertical-align:1px}
.row.duty{background:var(--duty-bg)} .row.duty .tag{background:var(--duty);color:var(--card)}
.row.off{background:var(--off-bg)} .row.off .tag{background:var(--off);color:var(--card)}
.row.short{background:var(--short-bg)} .row.short .tag{background:var(--short);color:var(--card)}
.row.hol{background:var(--hol-bg)} .row.hol .tag{background:var(--hol);color:var(--card)}
.sum{display:flex;justify-content:space-between;padding:9px 14px;border-top:2px dashed var(--line);font-family:var(--font-cond);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.sum b{font-family:var(--font-mono);color:var(--fg);letter-spacing:0;font-variant-numeric:tabular-nums}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:2px;padding:16px;color:var(--muted);font-size:14px}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--band)}
body{margin:0;min-height:100vh}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.bugbtn{align-self:center;font-family:var(--font-cond);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);background:transparent;border:2px solid var(--line);border-radius:2px;padding:8px 16px;cursor:pointer}
.bugbtn:focus-visible,.bug button:focus-visible,.bug textarea:focus-visible,.bug input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bugwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bug{background:var(--card);border:2px solid var(--line);border-radius:2px;width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.bug h2{margin:0;font-family:var(--font-stencil);font-weight:400;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.bug label{font-family:var(--font-cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.bug textarea,.bug input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:2px;background:var(--bg);color:var(--fg)}
.bug textarea{min-height:120px;resize:vertical}
.bug .ctx{font-size:12px;color:var(--muted);margin:0}
.bug .row2{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.bug button{font-family:var(--font-cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;padding:9px 18px;border-radius:2px;cursor:pointer;border:2px solid var(--accent)}
.bug .send{background:var(--accent);color:var(--card)}
.bug .cancel{background:transparent;color:var(--fg);border-color:var(--line)}
.bug .send:disabled{opacity:.6;cursor:default}
.bug .msg{font-size:14px;margin:0}
.bug .msg.err{color:var(--duty)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<header class="band"><div>
  <div><h1>Službař</h1>
  <p class="sub">beta verze</p></div>
  <svg class="vojak" viewBox="4 2 96 112" role="img" aria-label="Voják s puškou a párkem">
    <g stroke="#1d1f14" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <!-- puška přes rameno -->
      <line x1="44" y1="86" x2="21" y2="30" stroke="#1d1f14" stroke-width="8.5"/>
      <line x1="44" y1="86" x2="21" y2="30" stroke="#8a5a30" stroke-width="5.5"/>
      <line x1="23" y1="36" x2="13" y2="9" stroke="#1d1f14" stroke-width="5.2"/>
      <line x1="23" y1="36" x2="13" y2="9" stroke="#6d7177" stroke-width="2.6"/>
      <!-- nohy a boty -->
      <rect x="38.5" y="90" width="9" height="15" fill="#4a5826"/>
      <rect x="52.5" y="90" width="9" height="15" fill="#4a5826"/>
      <rect x="35.5" y="103" width="13" height="7" rx="3" fill="#2a2418"/>
      <rect x="51.5" y="103" width="13" height="7" rx="3" fill="#2a2418"/>
      <!-- tělo -->
      <rect x="33" y="56" width="34" height="38" rx="11" fill="#5d6d30"/>
      <line x1="37" y1="60" x2="62" y2="89" stroke="#3b2f1e" stroke-width="3.5"/>
      <rect x="33.5" y="81" width="33" height="5" fill="#3b2f1e"/>
      <rect x="47" y="81.5" width="6" height="4" fill="#c9a94a" stroke-width="1"/>
      <!-- pravá ruka drží řemen -->
      <path d="M36 61 Q27 68 31 77" fill="none" stroke="#1d1f14" stroke-width="9.5"/>
      <path d="M36 61 Q27 68 31 77" fill="none" stroke="#5d6d30" stroke-width="6.5"/>
      <circle cx="31.5" cy="78" r="4" fill="#f0c493"/>
      <!-- levá ruka -->
      <path d="M64 61 Q83 64 80 49" fill="none" stroke="#1d1f14" stroke-width="9.5"/>
      <path d="M64 61 Q83 64 80 49" fill="none" stroke="#5d6d30" stroke-width="6.5"/>
      <!-- hlava -->
      <circle cx="50" cy="44" r="15" fill="#f0c493"/>
      <circle cx="44" cy="50" r="2.6" fill="#ec9a86" stroke="none"/>
      <circle cx="47" cy="43" r="1.9" fill="#1d1f14" stroke="none"/>
      <circle cx="56" cy="42.5" r="1.9" fill="#1d1f14" stroke="none"/>
      <path d="M44 39.5 L49 38.5 M53.5 37.8 L58.5 38.5" fill="none" stroke-width="1.4"/>
      <ellipse cx="59" cy="50" rx="3.6" ry="3" fill="#5a1d17"/>
      <!-- helma -->
      <path d="M31 39 A19 18 0 0 1 69 39 Z" fill="#4b5a24"/>
      <ellipse cx="50" cy="39" rx="22" ry="3.6" fill="#3e4b1d"/>
      <path d="M38 30 L44 26 M48 24 L54 23 M58 26 L63 30" fill="none" stroke="#2f3916" stroke-width="1.2"/>
      <!-- nakousnutý párek -->
      <g transform="translate(67.5 50) rotate(-17) scale(1.25)">
        <path d="M3 -4 L21 -4 A4 4 0 0 1 21 4 L2 4 Q5 3 4 1.3 Q6.2 0 3.8 -1.4 Q5.6 -3 3 -4 Z" fill="#c0553a"/>
        <path d="M2.8 3.2 Q4.8 2.6 4.2 1.4 Q5.6 0 4.2 -1.4 Q5.2 -2.8 3.6 -3.3" fill="none" stroke="#f2b8a0" stroke-width="1.4"/>
        <path d="M8 -2 L20 -2" fill="none" stroke="#e08a6a" stroke-width="1.6"/>
      </g>
      <circle cx="81" cy="46" r="4.6" fill="#f0c493"/>
    </g>
  </svg>
</div></header>
<div class="wrap">

  <div class="pick">
    <div class="pick-head">
      <label for="d">Datum služby</label>
      <div class="seg" role="radiogroup" aria-label="Počet služeb">
        <input type="radio" name="n" id="n1" value="1" checked><label for="n1">1 služba</label>
        <input type="radio" name="n" id="n2" value="2"><label for="n2">2 služby</label>
      </div>
    </div>
    <div class="datebox"><input type="date" id="d" aria-label="Datum 1. služby"></div>
    <div class="datebox" hidden><input type="date" id="d2" aria-label="Datum 2. služby"></div>
    <div class="info" id="info"></div>
  </div>

  <div id="out"></div>
  <button type="button" class="bugbtn" id="bugOpen">Nahlásit chybu</button>
</div>

<div class="bugwrap" id="bugWrap" hidden>
  <form class="bug" id="bugForm" novalidate>
    <h2>Nahlásit chybu</h2>
    <label for="bugText">Co nesedí?</label>
    <textarea id="bugText" name="popis" required placeholder="Např. po páteční službě mi má vyjít volno už ve středu od 9:30…"></textarea>
    <label for="bugName">Jméno (nepovinné)</label>
    <input type="text" id="bugName" name="jmeno" autocomplete="name">
    <div class="hp" aria-hidden="true"><input type="checkbox" name="botcheck" id="bugBot" tabindex="-1"></div>
    <p class="ctx" id="bugCtx"></p>
    <p class="msg" id="bugMsg" role="status"></p>
    <div class="row2">
      <button type="button" class="cancel" id="bugCancel">Zavřít</button>
      <button type="submit" class="send" id="bugSend">Odeslat</button>
    </div>
  </form>
</div>

<script>

// Svátky podle sekcí předpisu (sekce 0 = běžné pracovní dny)
const SECTIONS = [
  [],
  ["2026-04-03","2026-04-06"],
  ["2026-05-01","2026-05-08"],
  ["2026-07-05","2026-07-06"],
  ["2026-09-28"],
  ["2026-10-28"],
  ["2026-11-17"],
  ["2026-12-24","2026-12-25","2026-12-26","2027-01-01"]
];
const HOLIDAYS = new Set(["2026-01-01"].concat(...SECTIONS));
const NORMAL = ["0630-1530","0630-1530","0630-1530","0630-1530","0630-1300"];
const DAYS = ["Po","Út","St","Čt","Pá","So","Ne"];
const DAYS_LONG = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];

const TABLES = DATA.map(([sec,st,a,b]) => ({sec, st, w:[a,b].map(s => s.split(";").map(r => {
  const [s1,e1,f,h] = r.split("-"); return {s:s1,e:e1,f:+f,h:h==="1"};
}))}));

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = v => { const [y,m,dd]=v.split("-").map(Number); return new Date(y,m-1,dd); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => addDays(d, -((d.getDay()+6)%7));
const diff = (a,b) => Math.round((b-a)/86400000);
const fmt = d => d.getDate()+". "+(d.getMonth()+1)+".";
const full = d => `${DAYS_LONG[d.getDay()]} ${fmt(d)} ${d.getFullYear()}`;
const t = s => (s==="0000" ? "0:00" : String(+s.slice(0,2))+":"+s.slice(2));
const tEnd = s => (s==="0000" ? "24:00" : t(s));
const hrs = n => String(n).replace(".",",");

function findTable(starts, mon){
  const same = (a,b) => a.length===b.length && a.every((x,i)=>x===b[i]);
  const window = [...Array(14)].map((_,i)=>iso(addDays(mon,i)));
  // svátky v pracovních dnech obou týdnů
  const hw = [0,1].map(w => [0,1,2,3,4].filter(i => HOLIDAYS.has(window[w*7+i])));
  const sec = SECTIONS.findIndex((h,i) => i>0 && h.some(x => window.includes(x)));
  if(sec>0){
    const m = TABLES.find(tb => tb.sec===sec && same(tb.st,starts) &&
      [0,1].every(w => same(tb.w[w].map((r,i)=>r.h?i:-1).filter(i=>i>=0&&i<5), hw[w])));
    if(m) return {tb:m, special:true};
  }
  const n = TABLES.find(tb => tb.sec===0 && same(tb.st,starts));
  return n ? {tb:n, special:false} : null;
}

    let cls="", tag="", val="", note="";
    if(isDuty){ cls="duty"; tag="Služba"; val=`${t(r.s)} – ${tEnd(r.e)}`; }
    else if(isHol){ cls="hol"; tag="Svátek"; }
    else if(!r.s){ if(i>4) return; cls="off"; tag="Volno"; val="celý den"; }
    else if(i<5 && `${r.s}-${r.e}`!==NORMAL[i]){
      cls="short"; tag="Upraveno"; val=`${t(r.s)} – ${tEnd(r.e)}`;
      note = `<em>volno od ${tEnd(r.e)}</em>`;
    } else val=`${t(r.s)} – ${tEnd(r.e)}`;
    html += `<div class="row ${cls}"><div class="day">${DAYS[i]}<small>${fmt(day)}</small></div>`+
      `<div class="val">${tag?`<span class="tag">${tag}</span>`:""}${val}${note}</div>`+
      `<div class="h">${r.f?hrs(r.f)+" h":""}</div></div>`;
  });
  return `<section class="week"><h2>${title}<span>${fmt(mon)} – ${fmt(addDays(mon,6))}</span></h2>${html}`+
    `<div class="sum"><span>Fond pracovní doby</span><b>${hrs(sum)} h</b></div></section>`;
}

function render(){
  const two = document.getElementById("n2").checked;
  const d2in = document.getElementById("d2");
  d2in.parentElement.hidden = !two;
  const v1 = document.getElementById("d").value, v2 = d2in.value;
  const info = document.getElementById("info"), out = document.getElementById("out");
  out.innerHTML = "";
  if(!v1){ info.textContent=""; return; }
  let dates = [parse(v1)];
  if(two){
    if(!v2){ info.innerHTML = `1. služba: <b>${full(dates[0])}</b>`; out.innerHTML = `<div class="empty">Vyber datum 2. služby.</div>`; return; }
    dates.push(parse(v2));
    dates.sort((a,b)=>a-b);
    info.innerHTML = `1. služba: <b>${full(dates[0])}</b><br>2. služba: <b>${full(dates[1])}</b>`;
  } else info.innerHTML = `Služba: <b>${full(dates[0])}</b>`;

  const mon = monday(dates[0]);
  const starts = dates.map(d => diff(mon,d));
  const res = findTable(starts, mon);
  if(!res){
    out.innerHTML = `<div class="empty">Tuto kombinaci služeb předpis neuvádí. Řeší se upravenou pracovní dobou v rozkaze.</div>`;
    return;
  }
  let html = weekHTML("1. týden", mon, res.tb.w[0]) + weekHTML("2. týden", addDays(mon,7), res.tb.w[1]);
  const y = dates[0].getFullYear(), yEnd = addDays(mon,13);
  if(y!==2026 || yEnd.getFullYear()>2027 || (yEnd.getFullYear()===2027 && yEnd.getMonth()>0))
    html += `<p class="note">Předpis platí pro rok 2026. Pro jiné období zobrazuji běžné rozvržení bez svátků.</p>`;
  else if(res.special) html += `<p class="note">Upravené rozvržení kvůli státnímu svátku.</p>`;
  out.innerHTML = html;
}

const input = document.getElementById("d");
input.addEventListener("change", render);
document.getElementById("d2").addEventListener("change", render);
document.querySelectorAll('input[name="n"]').forEach(r => r.addEventListener("change", render));
// Výchozí stav: nejbližší pátek
(function(){
  const now = new Date(); const n = addDays(now, (5 - now.getDay() + 7) % 7);
  input.value = iso(n);
  render();
})();

// Nahlášení chyby přes Web3Forms (adresa příjemce není v aplikaci vidět)
(function(){
  const KEY = "d370a49a-1f83-45d8-9757-8703774ce4c1";
  const wrap = document.getElementById("bugWrap"), form = document.getElementById("bugForm");
  const txt = document.getElementById("bugText"), nm = document.getElementById("bugName");
  const msg = document.getElementById("bugMsg"), send = document.getElementById("bugSend");
  const ctxEl = document.getElementById("bugCtx");
  const context = () => {
    const two = document.getElementById("n2").checked;
    const d1 = document.getElementById("d").value, d2 = document.getElementById("d2").value;
    return `Režim: ${two ? "2 služby" : "1 služba"} | Datum 1: ${d1 || "-"}${two ? " | Datum 2: " + (d2 || "-") : ""}`;
  };
  const close = () => { wrap.hidden = true; };
  // Omezení: 2 minuty mezi hlášeními, max. 5 hlášení za den z jednoho telefonu
  const PAUSE = 120000, PER_DAY = 5, LS = "sluzbar_bug_log";
  let openedAt = 0;
  const log = () => { try { return JSON.parse(localStorage.getItem(LS) || "[]").filter(t => Date.now() - t < 86400000); } catch(e) { return []; } };
  const save = l => { try { localStorage.setItem(LS, JSON.stringify(l)); } catch(e) {} };
  const blocked = () => {
    const l = log();
    if (l.length >= PER_DAY) return "Dnes už jsi poslal 5 hlášení. Další můžeš poslat zítra.";
    const wait = l.length ? Math.ceil((PAUSE - (Date.now() - Math.max(...l))) / 1000) : 0;
    if (wait > 0) return `Další hlášení můžeš poslat za ${wait > 60 ? Math.ceil(wait/60) + " min" : wait + " s"}.`;
    return "";
  };
  document.getElementById("bugOpen").addEventListener("click", () => {
    msg.textContent = ""; msg.className = "msg"; send.disabled = false; send.textContent = "Odeslat";
    ctxEl.textContent = "Přiloží se: " + context();
    openedAt = Date.now();
    const b = blocked(); if (b) { msg.textContent = b; msg.className = "msg err"; send.disabled = true; }
    wrap.hidden = false; txt.focus();
  });
  document.getElementById("bugCancel").addEventListener("click", close);
  wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !wrap.hidden) close(); });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (txt.value.trim().length < 5) { msg.textContent = "Napiš prosím, co nesedí."; msg.className = "msg err"; txt.focus(); return; }
    if (document.getElementById("bugBot").checked || Date.now() - openedAt < 3000) return;
    const b = blocked(); if (b) { msg.textContent = b; msg.className = "msg err"; return; }
    send.disabled = true; send.textContent = "Odesílám…"; msg.textContent = ""; msg.className = "msg";
    try {
      const r = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: {"Content-Type": "application/json", "Accept": "application/json"},
        body: JSON.stringify({
          access_key: KEY,
          subject: "Službař – hlášení chyby",
          from_name: "Službař",
          jmeno: nm.value.trim() || "neuvedeno",
          popis: txt.value.trim(),
          kontext: context(),
          zarizeni: navigator.userAgent,
          cas: new Date().toLocaleString("cs-CZ")
        })
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.success === false) throw new Error(data.message || "chyba");
      save(log().concat(Date.now()));
      msg.textContent = "Odesláno, díky!"; send.textContent = "Odesláno";
      txt.value = ""; setTimeout(close, 1500);
    } catch (err) {
      msg.textContent = "Odeslání se nepovedlo. Zkontroluj připojení k internetu a zkus to znovu.";
      msg.className = "msg err"; send.disabled = false; send.textContent = "Odeslat";
    }
  });
})();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{})); }
</script>
